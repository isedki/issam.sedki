name: Resume

# Every change to the resume runs the validator and the planted-regression tests.
# The site deploys to Vercel only from main, and only if every check passes.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-deploy:
    runs-on: ubuntu-24.04  # pinned: the page count depends on the LibreOffice version
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: resume/requirements.txt

      - name: LibreOffice and Carlito (metric-compatible with Calibri) to measure pages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito

      - run: npm ci
      - run: pip install -r resume/requirements.txt

      - name: Validate the resume and test the validator
        run: npm run resume:check
        env:
          PYTHON: python

      - run: npm run lint
      - run: npm run build

      - name: Keep the generated resume and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resume
          path: |
            resume/*.docx
            resume/*.pdf
            resume/validation_report.md
            resume/validation.json
            resume/regressions.json

      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@63.1.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@63.1.2 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@63.1.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
